[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "miamico-pyslick"
version = "0.3.3"
description = "Local, no-LLM smart code query/patch agent (fuzzy match + AST call-graph)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rapidfuzz>=3.0",
    "pyperclip>=1.8",
    "colorama>=0.4",
    "libcst>=1.0",
    "networkx>=3.0",
    "tree-sitter>=0.21",
    "tree-sitter-typescript>=0.21",
    "tree-sitter-language-pack>=0.1",
    "watchdog>=3.0",
    "nltk>=3.8",
    "yake>=0.4",
    "transformers>=4.30",
]

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.2", "sentence-transformers>=2.0"]

[project.scripts]
pyslick = "pyslick:main"

[tool.setuptools]
packages = ["pyslick"]

[tool.setuptools.package-data]
pyslick = ["*.json"]